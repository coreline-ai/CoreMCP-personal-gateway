[project]
name = "coremcp-api"
version = "0.1.0"
description = "CoreMCP FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.5.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "aiosqlite>=0.20.0",
  "structlog>=24.0.0",
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pyjwt[crypto]>=2.10.0",
  "cryptography>=43.0.0",
  "playwright>=1.52.0",
  "jsonschema>=4.23.0",
]

[project.scripts]
coremcp = "coremcp.cli:main"

[project.optional-dependencies]
redis = [
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coremcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["coremcp"]
omit = [
  "coremcp/cli.py",
  "coremcp/refresh.py",
  "coremcp/smoke.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
skip_empty = true

[tool.pyright]
pythonVersion = "3.12"
include = ["coremcp"]
exclude = ["**/__pycache__", "**/.venv", "tests"]
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = false
reportGeneralTypeIssues = "warning"
# FastAPI route handlers (54+) and starlette private members are flagged as
# unused / private-usage because their wiring happens via decorators or
# typed-protocol monkey-patching. Both patterns are intentional.
reportUnusedFunction = "none"
reportPrivateUsage = "none"

[tool.bandit]
# B101 — `assert` statements are fine outside tests for invariant checks.
# B608 — every flagged `f"..."` query uses an internal allowlist for column
#        names and binds user-supplied values via `?` placeholders; reviewed
#        in db/repository_audit.py, repository_credentials.py, repository_jobs.py,
#        repository_services.py (2 sites). See dev-plan/implement_20260522_183112.md.
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B608"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "fakeredis>=2.20",
    "pip-audit>=2.7",
    "pyright>=1.1.409",
    "pytest-cov>=7.1.0",
]
