[project]
name = "fake-mcp"
version = "0.1.0"
description = "Test-only downstream MCP server for CoreMCP P0/P1 integration tests."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[project.scripts]
fake-mcp = "fake_mcp.main:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fake_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
