[project]
name = "git-workspace-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing git status / log / diff / blame for personal project workspaces."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
git-workspace-mcp = "git_workspace_mcp.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["git_workspace_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
