name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: API tests + coverage gate
        run: cd apps/api && uv run pytest --cov=coremcp --cov-fail-under=80
      - name: Bandit security scan
        run: cd apps/api && uv run bandit -c pyproject.toml -r coremcp -ll -ii
      - name: Fake MCP tests
        run: cd apps/fake-mcp && uv run pytest
      - name: Project Docs MCP tests
        run: cd apps/project-docs-mcp && uv run pytest
      - name: Git Workspace MCP tests
        run: cd apps/git-workspace-mcp && uv run pytest

  pyright:
    # Baseline reached 0 errors in dev-plan/implement_20260523_082116.md Phase 3.
    # CI now blocks PRs that re-introduce errors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Pyright (basic mode, blocking)
        run: cd apps/api && uv run pyright

  restore-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup → restore round-trip
        run: infra/scripts/backup-restore-drill.sh

  dependency-audit:
    # Advisory CVE scan — current baseline is clean (ADR-048). Continues on
    # error so first newly-published CVE doesn't immediately block every PR;
    # the red ✗ on the PR summary surfaces it for triage.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: pip-audit (Python deps)
        run: cd apps/api && uv run pip-audit
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: pnpm audit (Node deps, high+)
        run: pnpm audit --audit-level high

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm lint
      - run: cd apps/web && pnpm typecheck
      - run: pnpm build
